apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: liman-appset
spec:
  goTemplate: true
  generators:
  - list:
      elements:
      - env: prod
      - env: staging

  template:
    metadata:
      name: '{{.env}}-liman'
    spec:
      project: default
      source:
        repoURL: https://github.com/liman/hello-svc.git
        targetRevision: HEAD
        path: application/{{.env}}.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: liman-app